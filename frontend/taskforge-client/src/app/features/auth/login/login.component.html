<div class="login-container">

  <div class="login-card">

    <h1>TaskForge</h1>

    <h2>Welcome Back</h2>

    <p class="subtitle">
      Sign in to continue to TaskForge
    </p>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          autocomplete="email"
        />

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />

      </div>

      @if (errorMessage) {
        <p class="error">
          {{ errorMessage }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loading">

        @if (loading) {
          Logging in...
        } @else {
          Login
        }

      </button>

    </form>

  </div>

</div>
